name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python tests/run.py
      - name: Compile sources
        run: python -m compileall -q .

  wheel:
    name: Build and verify wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade build
      - run: python -m build --wheel
      - name: Verify installed package
        run: |
          python -m pip install dist/*.whl
          cd "$(mktemp -d)"
          python -c "from src.core import MissionEngine; print(MissionEngine.__name__)"

  pymavlink:
    name: Real pymavlink UDP loopback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[mavlink]"
      - run: python -m unittest tests.mavlink.test_pymavlink_integration -v
