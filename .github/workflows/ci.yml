name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type check and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install ".[quality]"
      - name: Ruff correctness checks
        run: ruff check .
      - name: Pyright baseline
        run: pyright --pythonpath "$(command -v python)"
      - name: Enforce patch API compatibility
        shell: bash
        run: |
          release_tag="$(git tag --merged HEAD^ --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          if [[ -n "$release_tag" ]]; then
            python tests/test_public_api.py --check-patch-compatible "$release_tag"
          fi
      - name: Branch coverage
        run: |
          coverage run run_tests.py
          coverage report

  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and version-specific dependencies
        run: python -m pip install .
      - name: Run unit tests
        run: python run_tests.py
      - name: Compile sources
        run: python -m compileall -q .

  stress:
    name: Concurrency stress
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python run_stress_tests.py --repeats 20

  benchmark:
    name: Performance regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      release_baseline: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Benchmark previous revision
        run: |
          git worktree add ../vehicle-core-baseline HEAD^
          (cd ../vehicle-core-baseline && python run_benchmarks.py --iterations 10000 --repeats 9 --json) > /tmp/vehicle-core-baseline.json
          for repetition in 1 2 3; do
            (cd ../vehicle-core-baseline && python run_benchmarks.py --load-profile normal --load-storage sqlite --json --no-log) > "/tmp/vehicle-core-load-baseline-${repetition}.json"
          done
          python run_benchmarks.py --aggregate-load /tmp/vehicle-core-load-baseline-{1,2,3}.json > /tmp/vehicle-core-load-baseline.json
          release_tag="$(git tag --merged HEAD^ --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          if [[ -n "$release_tag" && "$(git rev-parse "$release_tag^{commit}")" != "$(git rev-parse HEAD^)" ]]; then
            git worktree add ../vehicle-core-release-baseline "$release_tag"
            (cd ../vehicle-core-release-baseline && python run_benchmarks.py --iterations 10000 --repeats 9 --json) > /tmp/vehicle-core-release-baseline.json
            for repetition in 1 2 3; do
              (cd ../vehicle-core-release-baseline && python run_benchmarks.py --load-profile normal --load-storage sqlite --json --no-log) > "/tmp/vehicle-core-release-load-baseline-${repetition}.json"
            done
            python run_benchmarks.py --aggregate-load /tmp/vehicle-core-release-load-baseline-{1,2,3}.json > /tmp/vehicle-core-release-load-baseline.json
            echo "release_baseline=true" >> "$GITHUB_ENV"
          fi
      - name: Reject large microbenchmark regressions
        run: >-
          python run_benchmarks.py --iterations 10000 --repeats 9
          --compare /tmp/vehicle-core-baseline.json
          --max-regression-percent 35
      - name: Exercise the combined SQLite load path
        run: >-
          python run_benchmarks.py --load-profile normal --load-storage sqlite
          --load-repeats 3
          --compare-load /tmp/vehicle-core-load-baseline.json
          --max-regression-percent 35
      - name: Reject cumulative release regressions
        if: ${{ env.release_baseline == 'true' }}
        run: |
          python run_benchmarks.py --iterations 10000 --repeats 9 --compare /tmp/vehicle-core-release-baseline.json --max-regression-percent 35
          python run_benchmarks.py --load-profile normal --load-storage sqlite --load-repeats 3 --compare-load /tmp/vehicle-core-release-load-baseline.json --max-regression-percent 35
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-results
          path: |
            /tmp/vehicle-core-baseline.json
            /tmp/vehicle-core-load-baseline.json
            /tmp/vehicle-core-release-baseline.json
            /tmp/vehicle-core-release-load-baseline.json
            benchmark-logs.json

  arm64:
    name: ARM64 Python 3.12
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install ".[mavlink]"
      - run: python run_tests.py
      - run: python -m compileall -q .

  wheel:
    name: Build and verify wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade build
      - run: python -m build --wheel
      - name: Verify installed package
        run: |
          python -m pip install dist/*.whl
          cd "$(mktemp -d)"
          python -c "from src.core import MissionEngine; print(MissionEngine.__name__)"

  pymavlink:
    name: Real pymavlink UDP loopback
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install ".[mavlink]"
      - run: python -m unittest tests.mavlink.test_pymavlink_integration -v

  dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install optional runtime dependencies and auditor
        run: python -m pip install ".[mavlink,security]"
      - name: Audit the isolated job environment
        run: pip-audit --local --skip-editable
